[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' data: blob: https://rifapro-actual.onrender.com https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com https://jdjidfnzicrogwzwjzml.supabase.co; script-src 'self' 'unsafe-inline' blob: https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://rifapro-actual.onrender.com;"

[[redirects]]
  from = "https://rifafortunardp.netlify.app/*"
  to = "https://rifafortuna.win/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://admin.rifafortuna.win/*"
  to = "/admin.html"
  status = 200
  force = true